name: Weekly context drift report

# Scheduled workflows are disabled on forks by GitHub, so on a fork this runs
# only via workflow_dispatch. That is stated rather than papered over: a schedule
# that silently never fires is exactly the manufactured evidence this workflow
# exists to avoid.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: Days of history to review
        default: '7'
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    name: Collect context drift signals
    runs-on: ubuntu-latest
    permissions:
      contents: read # read history for the git collector
      pull-requests: read # read merged review comments
      issues: write # publish or update the single tracking issue
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the git collector walks history, not just the tip
          persist-credentials: false

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Collect signals
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          {
            node .cursor/skills/convention-drift-review/scripts/collect-drift-signals.mjs \
              --since "$DAYS days ago"
            echo
            node .cursor/skills/convention-drift-review/scripts/collect-review-signals.mjs \
              --since "$DAYS"
          } | tee report.md

      # Every signal section is an h2. No h2 means nothing to report, and nothing
      # is published: an automation that files something every week gets muted.
      - name: Publish or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! grep -q '^## ' report.md; then
            echo "No signals. Nothing published."
            exit 0
          fi

          title='Weekly context drift report'
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')

          {
            echo "Signals collected from merged work. These are evidence, not conclusions."
            echo "Run the \`convention-drift-review\` skill against this report to turn any"
            echo "of it into a cited proposal, or to conclude that none of it warrants one."
            echo
            cat report.md
          } > body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
