skip_output:
  - meta
  - execution_out
  - skips

min_version: 1.4.3

rc: ./lefthook.rc

pre-commit:
  parallel: true
  commands:
    frontend-lint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
      run: |
        yarn eslint --ext .js,.jsx,.ts,.tsx,.mjs,.cjs,.mts,.cts --cache --prune-suppressions --fix {staged_files} &&
        git add eslint-suppressions.json &&
        yarn prettier --write {staged_files}
      stage_fixed: true

    other-format:
      glob: '*.{json,scss,md,mdx}'
      run: yarn prettier --write {staged_files}
      stage_fixed: true

    cursor-workflow:
      glob: '.cursor/**/*.{md,mjs}'
      run: |
        node --check .cursor/skills/grafana-conventions/scripts/check-references.mjs &&
        node --check .cursor/skills/grafana-implementation/scripts/check-bounds.mjs &&
        node --check .cursor/skills/convention-drift-review/scripts/collect-drift-signals.mjs &&
        node --check .cursor/skills/convention-drift-review/scripts/collect-review-signals.mjs &&
        node .cursor/skills/grafana-conventions/scripts/check-references.mjs &&
        node .cursor/skills/grafana-implementation/scripts/check-bounds.mjs --self-test &&
        node .cursor/skills/convention-drift-review/scripts/collect-drift-signals.mjs --self-test &&
        node .cursor/skills/convention-drift-review/scripts/collect-review-signals.mjs --self-test

    typecheck-smoke:
      glob: '{public/app/**/__smoke__/**,public/app/**/*.smoke.ts,scripts/cuj-smoke.ts,tsconfig.smoke.json}'
      run: yarn typecheck:smoke

    backend-format:
      glob: '*pkg/**/*.go'
      run: gofmt -w -s {staged_files}
      stage_fixed: true

    cue-fix-kinds:
      glob: '*kinds/**/*.cue'
      run: make fix-cue
      stage_fixed: true

    cue-fix-public:
      glob: '*public/app/plugins/**/**/*.cue'
      run: make fix-cue
      stage_fixed: true

    jsonnet-gen-dev-dashboards:
      # `**/*.json` needs at least one directory between dev-dashboards/ and the
      # filename, so it misses top-level dashboards like home.json/all-panels.json;
      # `**` alone matches those too. `files:` overrides lefthook's default
      # staged-files command (which filters to --diff-filter=ACMR, excluding
      # deletions) so a deleted dashboard also regenerates the manifest.
      glob: '*devenv/dev-dashboards/**'
      files: git diff --name-only --cached --diff-filter=ACMRD
      run: make gen-jsonnet && git add devenv/jsonnet/dev-dashboards.libsonnet

pre-push:
  commands:
    # A local gate, not a guarantee: lefthook is opt-in and `--no-verify`
    # bypasses it. The guarantee for delivery is branch protection on main.
    change-bounds:
      run: node .cursor/skills/grafana-implementation/scripts/check-bounds.mjs
